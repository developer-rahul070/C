<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luxury Cutie Pie ♡</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Decorations -->
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="heart heart-one">♡</div>
    <div class="heart heart-two">♥</div>
    <div class="heart heart-three">♡</div>

    <!-- Calculator -->
    <main class="calculator">

        <!-- Top Decoration -->
        <div class="top-decoration">
            <span class="bow">🎀</span>
            <span class="crown">♕</span>
        </div>

        <!-- Brand -->
        <div class="brand">
            <span>♡</span>
            MY CALCULATOR
            <span>♡</span>
        </div>

        <div class="love-title">
            For My Love
        </div>

        <p class="subtitle">
            cute • sweet • luxury
        </p>

        <!-- Display -->
        <section class="display">

            <div class="display-heart">♡</div>

            <div class="previous-value" id="previousValue"></div>

            <div class="current-value" id="currentValue">
                0
            </div>

        </section>

        <!-- Buttons -->
        <section class="buttons">

            <button class="btn special" data-action="clear">AC</button>
            <button class="btn special" data-action="delete">⌫</button>
            <button class="btn special" data-action="percent">%</button>
            <button class="btn operator" data-operation="÷">÷</button>

            <button class="btn number" data-number="7">7</button>
            <button class="btn number" data-number="8">8</button>
            <button class="btn number" data-number="9">9</button>
            <button class="btn operator" data-operation="×">×</button>

            <button class="btn number" data-number="4">4</button>
            <button class="btn number" data-number="5">5</button>
            <button class="btn number" data-number="6">6</button>
            <button class="btn operator" data-operation="−">−</button>

            <button class="btn number" data-number="1">1</button>
            <button class="btn number" data-number="2">2</button>
            <button class="btn number" data-number="3">3</button>
            <button class="btn operator" data-operation="+">+</button>

            <button class="btn number zero" data-number="0">
                0 <small>♡</small>
            </button>

            <button class="btn number" data-number=".">.</button>

            <button class="btn equal" data-action="equals">
                = <span>♡</span>
            </button>

        </section>

        <!-- Bottom -->
        <div class="bottom-message">
            <span>♡</span>
            ALWAYS WITH YOU
            <span>♡</span>
        </div>

        <div class="footer">
            Made with love ♡
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
